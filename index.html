<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover" />
    <title>Octane: Social Driving</title>

    <!-- PWA / iOS Add to Home Screen -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="A social driving game for car enthusiasts featuring competitive track modes, safe driving challenges, and real-time crew voice chat." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Octane" />
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind is now a local build (tailwind.config.js + postcss.config.js +
         index.css, imported from index.tsx) so the WebView no longer needs the
         cdn.tailwindcss.com Play CDN at runtime. The import-map below is inert in
         the built bundle (Vite resolves bare specifiers to local assets); it
         stays so the unbuilt dev server still works. -->
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <!-- Vite entry point. Bundles index.tsx and its deps into dist/assets/ on build.
         The import-map above is inert in the built bundle (Vite resolves bare
         specifiers to local assets); it stays so the unbuilt dev server still works. -->
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
